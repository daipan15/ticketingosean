<!DOCTYPE html>
<html class="dark" lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="OSEAN - Beli tiket dan kelola pemesananmu." />
  <title>OSEAN - Login</title>
  <link rel="icon" type="image/png" href="assets/osean_logo.png" />

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <script>
    tailwind.config = {
      darkMode: "class",
      theme: { extend: {
        colors: {
          "on-surface-variant": "#ccc4cf", "tertiary": "#efc05e", "surface-variant": "#37352c",
          "on-primary-container": "#9981b5", "surface-container": "#212017",
          "surface-container-low": "#1d1c13", "surface-container-high": "#2c2a21",
          "secondary-container": "#4d5500", "on-background": "#e7e2d5",
          "inverse-on-surface": "#323127", "on-tertiary": "#402d00",
          "surface-bright": "#3b3930", "tertiary-container": "#312200",
          "on-secondary-container": "#c0c96c", "error": "#ffb4ab", "surface": "#15140c",
          "on-secondary": "#2e3300", "background": "#15140c", "secondary": "#c4cd6f",
          "on-primary-fixed-variant": "#523d6c", "surface-container-highest": "#37352c",
          "on-tertiary-fixed": "#261900", "on-surface": "#e7e2d5",
          "on-tertiary-container": "#ae8529", "error-container": "#93000a",
          "surface-dim": "#15140c", "on-tertiary-fixed-variant": "#5c4200",
          "primary-fixed": "#eedbff", "secondary-fixed": "#e0ea88", "on-primary": "#3b2754",
          "inverse-surface": "#e7e2d5", "outline": "#958e99", "tertiary-fixed-dim": "#efc05e",
          "on-secondary-fixed-variant": "#444b00", "surface-container-lowest": "#0f0e07",
          "on-secondary-fixed": "#1a1e00", "tertiary-fixed": "#ffdea2",
          "inverse-primary": "#6b5585", "on-primary-fixed": "#25113e",
          "primary-fixed-dim": "#d6bcf4", "primary": "#d6bcf4", "surface-tint": "#d6bcf4",
          "primary-container": "#2e1a47", "on-error-container": "#ffdad6",
          "on-error": "#690005", "secondary-fixed-dim": "#c4cd6f", "outline-variant": "#4a454e"
        },
        borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" },
        spacing: { "margin-mobile": "20px", "unit": "8px", "asymmetric-offset": "12px",
                   "margin-desktop": "64px", "gutter": "24px" },
        fontFamily: {
          "body-lg": ["Manrope"], "body-md": ["Manrope"],
          "headline-lg-mobile": ["Syne"], "display-lg": ["Syne"], "display-md": ["Syne"],
          "label-caps": ["Manrope"], "headline-lg": ["Syne"]
        },
        fontSize: {
          "body-lg":  ["18px", { lineHeight: "1.6", fontWeight: "400" }],
          "body-md":  ["16px", { lineHeight: "1.6", fontWeight: "400" }],
          "headline-lg-mobile": ["28px", { lineHeight: "1.2", fontWeight: "700" }],
          "display-lg":  ["64px", { lineHeight: "1.1", letterSpacing: "-0.02em", fontWeight: "800" }],
          "display-md":  ["48px", { lineHeight: "1.1", fontWeight: "800" }],
          "label-caps":  ["12px", { lineHeight: "1.0", letterSpacing: "0.1em", fontWeight: "700" }],
          "headline-lg": ["32px", { lineHeight: "1.2", fontWeight: "700" }]
        }
      }}
    }
  </script>

  <style>
    /* Sembunyikan scrollbar tapi tetap bisa discroll */
    html, body {
      scrollbar-width: none; /* Firefox */
      -ms-overflow-style: none; /* IE dan Edge */
    }
    html::-webkit-scrollbar, body::-webkit-scrollbar {
      display: none; /* Chrome, Safari, Opera */
      width: 0px;
      background: transparent;
    }

    /* Toast notification */
    #toast { transition: opacity 0.4s ease; }
    #toast.hidden { opacity: 0; pointer-events: none; }

    /* Noise texture overlay */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
    }

    /* Floating & Decorative Animations */
    @keyframes float-gentle {
      0%, 100% { transform: translateY(0px) rotate(var(--rot, 0deg)); }
      50% { transform: translateY(-14px) rotate(calc(var(--rot, 0deg) + 3deg)); }
    }
    @keyframes float-reverse {
      0%, 100% { transform: translateY(0px) rotate(var(--rot, 0deg)); }
      50% { transform: translateY(14px) rotate(calc(var(--rot, 0deg) - 3deg)); }
    }
    @keyframes pulse-glow {
      0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.8; }
      50% { transform: scale(1.08) rotate(4deg); opacity: 1; }
    }
    @keyframes spin-ultra-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-float-1 { animation: float-gentle 5s ease-in-out infinite; }
    .animate-float-2 { animation: float-reverse 6.5s ease-in-out infinite; }
    .animate-float-3 { animation: float-gentle 7s ease-in-out infinite; }
    .animate-pulse-glow { animation: pulse-glow 4s ease-in-out infinite; }
    .animate-spin-slow { animation: spin-ultra-slow 45s linear infinite; }
    .animate-float-gentle-slow { animation: float-gentle 8s ease-in-out infinite; }

    .bg-splatter {
      background:
        radial-gradient(circle at 80% 20%, #5B2E8C 0%, transparent 45%),
        radial-gradient(circle at 20% 80%, #2E1A47 0%, transparent 50%);
    }
  </style>
</head>

<body class="bg-background text-on-background font-body-md overflow-x-hidden min-h-screen flex items-center justify-center relative selection:bg-tertiary selection:text-on-tertiary">

  <!-- Ambient Glow Background -->
  <div class="fixed inset-0 bg-splatter opacity-70 pointer-events-none -z-10"></div>

  <!-- Decorative Floating Festival Stickers -->
  <img src="assets/starburst.png" alt=""
    class="absolute top-10 right-10 sm:right-24 w-32 sm:w-44 opacity-40 pointer-events-none select-none animate-spin-slow filter drop-shadow-[0_0_30px_rgba(239,192,94,0.3)] z-0" />

  <img src="assets/clapboard.png" alt=""
    class="hidden sm:block absolute top-16 left-12 lg:left-24 w-28 lg:w-36 opacity-75 pointer-events-none select-none animate-float-1 drop-shadow-[0_12px_24px_rgba(0,0,0,0.6)] z-0"
    style="--rot: -14deg;" />

  <img src="assets/drum.png" alt=""
    class="hidden sm:block absolute bottom-24 right-10 lg:right-24 w-28 lg:w-36 opacity-75 pointer-events-none select-none animate-float-2 drop-shadow-[0_12px_24px_rgba(0,0,0,0.6)] z-0"
    style="--rot: 12deg;" />

  <img src="assets/camera.png" alt=""
    class="hidden sm:block absolute bottom-16 left-10 lg:left-20 w-24 lg:w-32 opacity-70 pointer-events-none select-none animate-float-3 drop-shadow-[0_12px_24px_rgba(0,0,0,0.6)] z-0"
    style="--rot: 8deg;" />

  <!-- Crowd Hand rising from bottom -->
  <div class="fixed -bottom-6 right-0 sm:right-1/4 w-[280px] sm:w-[420px] pointer-events-none select-none -z-10 opacity-50 sm:opacity-65">
    <img src="assets/hand.png" alt="" class="w-full h-auto animate-float-gentle-slow" />
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed top-6 right-6 z-[99999] hidden">
    <div id="toast-inner" class="flex items-center gap-3 px-5 py-3 border-2 shadow-[4px_4px_0px_0px_#15140c] font-label-caps text-label-caps uppercase">
      <span id="toast-icon" class="material-symbols-outlined text-[20px]"></span>
      <span id="toast-msg"></span>
    </div>
  </div>

  <!-- ===================== LOGIN FORM ===================== -->
  <div class="w-full max-w-md px-margin-mobile relative z-10 py-8 sm:py-12">

    <!-- Logo -->
    <div class="mb-10 text-center flex flex-col items-center">
      <a href="landing_page.html" class="flex flex-col items-center group">
        <img src="assets/osean_logo.png" alt="OSEAN Logo" class="w-16 h-16 object-contain mb-3 drop-shadow-[0_4px_16px_rgba(239,192,94,0.35)] group-hover:scale-105 transition-transform duration-300" />
        <span class="font-display-lg text-4xl sm:text-[52px] text-tertiary uppercase tracking-tighter leading-none group-hover:text-secondary transition-colors">
          OSEAN
        </span>
      </a>
      <p class="font-label-caps text-label-caps text-on-surface-variant uppercase mt-2">Closing Ceremony 2026</p>
    </div>

    <!-- Card -->
    <div class="relative">
      <div class="absolute inset-0 translate-x-2 translate-y-2 bg-tertiary-container -z-10"></div>
      <div class="bg-surface-container border-2 border-outline-variant p-5 sm:p-8">

        <h1 class="font-headline-lg text-headline-lg text-on-surface mb-1">Masuk</h1>
        <p class="font-body-md text-body-md text-on-surface-variant mb-8">
          Belum punya akun? <a href="register.html" class="text-tertiary hover:text-secondary underline transition-colors">Daftar disini</a>
        </p>

        <form id="login-form" class="flex flex-col gap-6" novalidate>

          <!-- Email -->
          <div>
            <label class="font-label-caps text-label-caps text-on-surface-variant uppercase block mb-2" for="email">Email</label>
            <input id="email" name="email" type="email" required autocomplete="email"
                   placeholder="kamu@email.com"
                   class="w-full bg-surface-container-high border-2 border-outline-variant text-on-surface font-body-md text-body-md px-4 py-3
                          focus:border-tertiary focus:outline-none transition-colors placeholder:text-on-surface-variant/40" />
          </div>

          <!-- Password -->
          <div>
            <label class="font-label-caps text-label-caps text-on-surface-variant uppercase block mb-2" for="password">Password</label>
            <div class="relative">
              <input id="password" name="password" type="password" required autocomplete="current-password"
                     placeholder="••••••••"
                     class="w-full bg-surface-container-high border-2 border-outline-variant text-on-surface font-body-md text-body-md px-4 py-3 pr-12
                            focus:border-tertiary focus:outline-none transition-colors placeholder:text-on-surface-variant/40" />
              <button type="button" id="toggle-pass"
                      class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-tertiary transition-colors">
                <span class="material-symbols-outlined" id="toggle-pass-icon">visibility</span>
              </button>
            </div>
          </div>

          <!-- Submit -->
          <button type="submit" id="submit-btn"
                  class="w-full bg-tertiary text-on-tertiary font-label-caps text-label-caps uppercase py-4 mt-2
                         shadow-[6px_6px_0px_0px_#15140c] hover:-translate-x-1 hover:-translate-y-1 hover:shadow-[8px_8px_0px_0px_#15140c]
                         active:translate-x-1 active:translate-y-1 active:shadow-none transition-all duration-200
                         flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
            <span class="material-symbols-outlined text-[20px]">login</span>
            Masuk
          </button>

        </form>

        <!-- Divider Atau -->
        <div class="relative my-6 flex items-center justify-center">
          <div class="border-t border-outline-variant w-full"></div>
          <span class="bg-surface-container px-3 text-on-surface-variant font-label-caps text-[11px] uppercase absolute tracking-widest">
            atau
          </span>
        </div>

        <!-- Tombol Google Login -->
        <button type="button" id="google-login-btn"
                class="w-full bg-[#ffffff] text-[#15140c] hover:bg-[#f1f1f1] font-label-caps text-label-caps uppercase py-3.5 px-4
                       border-2 border-outline-variant shadow-[6px_6px_0px_0px_#15140c] hover:-translate-x-1 hover:-translate-y-1 hover:shadow-[8px_8px_0px_0px_#15140c]
                       active:translate-x-1 active:translate-y-1 active:shadow-none transition-all duration-200
                       flex items-center justify-center gap-3 cursor-pointer">
          <svg class="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Masuk dengan Google</span>
        </button>

      </div>
    </div>

    <p class="text-center font-body-md text-body-md text-on-surface-variant mt-6 opacity-60">
      &copy; 2026 OSEAN. All rights reserved.
    </p>
  </div>

  <script>
    const API = '../osean-backend/api';

    // --- Konfigurasi Google Client ID ---
    // Masukkan Client ID dari Google Cloud Console kamu:
    const GOOGLE_CLIENT_ID = '869569142796-m45gvcj7mn25re40m3upel2f8lpp3ruj.apps.googleusercontent.com';

    // --- Toast Helper ---
    function showToast(msg, type = 'info') {
      const colors = {
        success: 'bg-secondary text-on-secondary border-[#15140c]',
        error:   'bg-error text-on-error border-[#15140c]',
        info:    'bg-surface-container text-on-surface border-outline-variant'
      };
      const icons = { success: 'check_circle', error: 'error', info: 'info' };
      const t  = document.getElementById('toast');
      const ti = document.getElementById('toast-inner');
      ti.className = `flex items-center gap-3 px-5 py-3 border-2 shadow-[4px_4px_0px_0px_#15140c] font-label-caps text-label-caps uppercase ${colors[type]}`;
      document.getElementById('toast-icon').textContent = icons[type];
      document.getElementById('toast-msg').textContent  = msg;
      t.classList.remove('hidden');
      t.style.opacity = '1';
      clearTimeout(t._timer);
      t._timer = setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.classList.add('hidden'), 400); }, 3500);
    }

    // --- Toggle Password ---
    const toggleBtn  = document.getElementById('toggle-pass');
    const passInput  = document.getElementById('password');
    const toggleIcon = document.getElementById('toggle-pass-icon');
    toggleBtn.addEventListener('click', () => {
      const visible = passInput.type === 'text';
      passInput.type           = visible ? 'password' : 'text';
      toggleIcon.textContent   = visible ? 'visibility' : 'visibility_off';
    });

    // --- Cek sudah login ---
    (async () => {
      try {
        const res  = await fetch(`${API}/session_check.php`);
        const data = await res.json();
        if (data.logged_in) {
          window.location.href = data.user.role === 'admin' ? 'admin_panel.html' : 'my_tickets.html';
        }
      } catch (e) { /* tidak ada session, lanjut */ }
    })();

    // --- Form Login Manual ---
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn   = document.getElementById('submit-btn');
      const email = document.getElementById('email').value.trim();
      const pass  = document.getElementById('password').value;

      if (!email || !pass) { showToast('Email dan password wajib diisi.', 'error'); return; }

      btn.disabled = true;
      btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">refresh</span> Loading...';

      try {
        const res  = await fetch(`${API}/login.php`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password: pass })
        });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem('isLoggedIn', 'true');
          showToast(data.message, 'success');
          setTimeout(() => {
            window.location.href = data.user.role === 'admin' ? 'admin_panel.html' : 'my_tickets.html';
          }, 800);
        } else {
          showToast(data.message || 'Login gagal.', 'error');
        }
      } catch (err) {
        console.error('Login error:', err);
        showToast('Tidak dapat terhubung ke server.', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span class="material-symbols-outlined text-[20px]">login</span> Masuk';
      }
    });

    // =============================================
    // GOOGLE LOGIN INTEGRATION
    // =============================================
    let googleTokenClient = null;

    function initGoogleAuth() {
      if (typeof google === 'undefined' || !google.accounts) return;

      const isConfigured = GOOGLE_CLIENT_ID && !GOOGLE_CLIENT_ID.includes('YOUR_GOOGLE_CLIENT_ID');

      if (isConfigured) {
        try {
          google.accounts.id.initialize({
            client_id: GOOGLE_CLIENT_ID,
            callback: (res) => sendGoogleAuthToBackend({ credential: res.credential }),
            auto_select: false
          });

          if (google.accounts.oauth2) {
            googleTokenClient = google.accounts.oauth2.initTokenClient({
              client_id: GOOGLE_CLIENT_ID,
              scope: 'email profile openid',
              callback: async (tokenRes) => {
                if (tokenRes.error) {
                  showToast('Autentikasi Google dibatalkan.', 'error');
                  return;
                }
                await sendGoogleAuthToBackend({ access_token: tokenRes.access_token });
              }
            });
          }
        } catch (e) {
          console.warn('Google SDK init error:', e);
        }
      }
    }

    // Tunggu Google SDK siap
    window.addEventListener('load', () => {
      setTimeout(initGoogleAuth, 500);
    });

    // Handler Kirim Auth Google ke Backend
    async function sendGoogleAuthToBackend(payload) {
      const gBtn = document.getElementById('google-login-btn');
      const originalHTML = gBtn.innerHTML;
      gBtn.disabled = true;
      gBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">refresh</span> Menghubungkan Google...';

      try {
        const res = await fetch(`${API}/google_auth.php`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem('isLoggedIn', 'true');
          showToast(data.message, 'success');
          setTimeout(() => {
            window.location.href = data.user.role === 'admin' ? 'admin_panel.html' : 'my_tickets.html';
          }, 800);
        } else {
          showToast(data.message || 'Login via Google gagal.', 'error');
        }
      } catch (err) {
        console.error('Google Auth Error:', err);
        showToast('Tidak dapat terhubung ke server autentikasi Google.', 'error');
      } finally {
        gBtn.disabled = false;
        gBtn.innerHTML = originalHTML;
      }
    }

    // Klik tombol Google Login
    document.getElementById('google-login-btn').addEventListener('click', () => {
      if (googleTokenClient) {
        googleTokenClient.requestAccessToken({ prompt: 'select_account' });
      } else if (typeof google !== 'undefined' && google.accounts && google.accounts.id) {
        google.accounts.id.prompt();
      } else {
        showToast('Menghubungkan ke layanan Google, silakan coba lagi...', 'info');
        initGoogleAuth();
      }
    });
  </script>
</body>
</html>
